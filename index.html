<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Fully Operating Calculator Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form class="calculator">
    <input type="radio" name="num1" id="n1-0" class="n1-0" checked>
    <input type="radio" name="num1" id="n1-1" class="n1-1">
    <input type="radio" name="num1" id="n1-2" class="n1-2">
    <input type="radio" name="num1" id="n1-3" class="n1-3">
    <input type="radio" name="num1" id="n1-4" class="n1-4">
    <input type="radio" name="num1" id="n1-5" class="n1-5">

    <input type="radio" name="num2" id="n2-0" class="n2-0" checked>
    <input type="radio" name="num2" id="n2-1" class="n2-1">
    <input type="radio" name="num2" id="n2-2" class="n2-2">
    <input type="radio" name="num2" id="n2-3" class="n2-3">
    <input type="radio" name="num2" id="n2-4" class="n2-4">
    <input type="radio" name="num2" id="n2-5" class="n2-5">

    <div class="screen">
      <div class="output"></div>
    </div>

    <div class="pad">
      <button type="reset" class="btn btn-clear">C</button>

      <div class="row-label">Num 1:</div>
      <label for="n1-1" class="btn">1</label>
      <label for="n1-2" class="btn">2</label>
      <label for="n1-3" class="btn">3</label>
      <label for="n1-4" class="btn">4</label>
      <label for="n1-5" class="btn">5</label>

      <div class="row-label">Num 2:</div>
      <label for="n2-1" class="btn">1</label>
      <label for="n2-2" class="btn">2</label>
      <label for="n2-3" class="btn">3</label>
      <label for="n2-4" class="btn">4</label>
      <label for="n2-5" class="btn">5</label>
    </div>
  </form>

</body>
</html>
